<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit - Vision Invest</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="deposit-container">

<h1>Deposit Funds</h1>

<p>Select an investment plan below.</p>

<div class="plans">

<div class="plan">
    <img src="images/starter.png" alt="Starter">
    <h2>Starter</h2>
    <h3>$150</h3>
</div>

<div class="plan">
    <img src="images/silver.png" alt="Silver">
    <h2>Silver</h2>
    <h3>$300</h3>
</div>

<div class="plan">
    <img src="images/gold.png" alt="Gold">
    <h2>Gold</h2>
    <h3>$500</h3>
</div>

<div class="plan">
    <img src="images/premium.png" alt="Premium">
    <h2>Premium</h2>
    <h3>$1000</h3>
</div>

</div>

<h2>Accepted Gift Cards</h2>

<select>
<option>Select Gift Card</option>
<option>Amazon Gift Card</option>
<option>Razer Gold (Recommended)</option>
<option>Apple Gift Card</option>
<option>Paysafe Gift card</option>
</select>

<p class="notice">
⚠️ Please upload a clear photo of the scratched side of your gift card.
</p>

<input type="file" accept="image/*">

<button class="btn">Submit Deposit</button>

</div>

</body>
</html>
