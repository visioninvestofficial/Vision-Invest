<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Vision Invest</title>
<link rel="stylesheet" href="css/admin.css">
<style>
.status-badge { padding: 3px 8px; border-radius: 12px; font-size: 13px; font-weight: 600; }
.status-active, .status-approved { background: #d1e7dd; color: #0a3622; }
.status-pending  { background: #fff3cd; color: #856404; }
.status-rejected, .status-suspended { background: #f8d7da; color: #58151c; }
.btn-approve { background:#198754;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;margin-right:4px; }
.btn-reject  { background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer; }
.msg-success { color:green;background:#d1e7dd;padding:8px;border-radius:4px; }
.msg-error   { color:red;background:#f8d7da;padding:8px;border-radius:4px; }
</style>
</head>
<body>

<div class="admin-dashboard">

<h1>Admin Dashboard</h1>
<p>Welcome, Administrator</p>

<div class="admin-grid">

<div class="admin-card">
<h2>Total Users</h2>
<h3 id="stat-users">0</h3>
</div>

<div class="admin-card">
<h2>Total Deposits</h2>
<h3 id="stat-deposits">$0.00</h3>
</div>

<div class="admin-card">
<h2>Pending Withdrawals</h2>
<h3 id="stat-withdrawals">0</h3>
</div>

<div class="admin-card">
<h2>Active Investments</h2>
<h3 id="stat-investments">0</h3>
</div>

</div>

<div class="admin-actions">
<a href="manage-users.html">Manage Users</a>
<a href="approve-deposits.html">Approve Deposits</a>
<a href="approve-withdrawals.html">Approve Withdrawals</a>
<a href="investment-plans.html">Investment Plans</a>
<a href="referral-management.html">Referral Management</a>
<a href="#" id="admin-logout-btn">Logout</a>
</div>

</div>

<script src="js/admin-dashboard.js"></script>
</body>
</html>
