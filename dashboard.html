<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Vision Invest</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<div class="dashboard">

    <h1>Welcome 👋 <span id="user-name"></span></h1>

    <div class="balance-card">

        <h2>Available Balance</h2>
        <h1 id="balance">$0.00</h1>

        <div class="balance-info">

            <div>
                <h3>Welcome Bonus</h3>
                <p id="welcome-bonus">$50.00 (Pending)</p>
            </div>

            <div>
                <h3>Active Investment</h3>
                <p id="active-plan">None</p>
            </div>

            <div>
                <h3>Referral Earnings</h3>
                <p id="referral-earnings">$0.00</p>
            </div>

        </div>

    </div>

    <div class="dashboard-grid">

        <a href="deposit.html" class="dash-card">
            <h3>💳 Deposit</h3>
            <p>Fund your account</p>
        </a>

        <a href="withdraw.html" class="dash-card">
            <h3>💸 Withdraw</h3>
            <p>Withdraw earnings</p>
        </a>

        <a href="history.html" class="dash-card">
            <h3>📜 History</h3>
            <p>View transactions</p>
        </a>

        <a href="referral.html" class="dash-card">
            <h3>👥 Referrals</h3>
            <p>Invite friends</p>
        </a>

        <a href="profile.html" class="dash-card">
            <h3>👤 Profile</h3>
            <p>Manage account</p>
        </a>

        <a href="#" id="logout-btn" class="dash-card">
            <h3>🚪 Logout</h3>
            <p>Sign out</p>
        </a>

    </div>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
